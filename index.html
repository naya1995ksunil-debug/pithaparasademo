            <div>
              <div className="font-display text-2xl font-semibold" style={{ color: C.maroon }}>4.8★</div>
              <div className="text-xs" style={{ color: C.inkSoft }}>Average rating</div>
            </div>
          </div>
        </div>
        <div className="rounded-3xl p-8 flex flex-col gap-5" style={{ backgroundColor: C.paper, border: `1px solid ${C.line}` }}>
          {["Rice soaked & ground fresh each morning", "Jaggery sourced from local Odisha farms", "Steamed in turmeric leaves, never plastic", "Packed and shipped the same day"].map((t, i) => (
            <div key={t} className="flex items-center gap-4">
              <div className="w-9 h-9 rounded-full flex items-center justify-center font-mono text-sm shrink-0" style={{ backgroundColor: C.cream, color: C.maroon }}>
                {String(i + 1).padStart(2, "0")}
              </div>
              <div className="text-sm font-medium">{t}</div>
            </div>
          ))}
        </div>
      </section>

      {/* TESTIMONIALS */}
      <section style={{ backgroundColor: C.paper, borderTop: `1px solid ${C.line}`, borderBottom: `1px solid ${C.line}` }} className="py-16">
        <div className="max-w-6xl mx-auto px-5">
          <div className="font-display text-base font-semibold" style={{ color: C.terracotta }}>
            ଗ୍ରାହକଙ୍କ କଥାରେ
          </div>
          <div className="text-xs font-semibold uppercase tracking-[0.18em]" style={{ color: C.terracotta }}>
            From Our Customers
          </div>
          <h2 className="font-display text-3xl sm:text-4xl font-semibold mt-1 mb-10" style={{ color: C.maroon }}>
            Tastes like home, they say
          </h2>
          <div className="grid md:grid-cols-3 gap-6">
            {TESTIMONIALS.map((t) => (
              <div key={t.name} className="rounded-3xl p-6" style={{ backgroundColor: C.cream }}>
                <div className="flex gap-0.5 mb-3">
                  {[...Array(5)].map((_, i) => (
                    <Star key={i} size={14} fill={C.gold} color={C.gold} />
                  ))}
                </div>
                <p className="text-sm leading-relaxed" style={{ color: C.ink }}>&ldquo;{t.quote}&rdquo;</p>
                <div className="mt-4 text-sm font-semibold" style={{ color: C.maroon }}>{t.name}</div>
                <div className="text-xs" style={{ color: C.inkSoft }}>{t.place}, Odisha</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* FAQ */}
      <section id="faq" className="max-w-3xl mx-auto px-5 py-16">
        <div className="font-display text-base font-semibold text-center" style={{ color: C.terracotta }}>
          ପ୍ରଶ୍ନ ଓ ଉତ୍ତର
        </div>
        <div className="text-xs font-semibold uppercase tracking-[0.18em] text-center" style={{ color: C.terracotta }}>
          Questions
        </div>
        <h2 className="font-display text-3xl sm:text-4xl font-semibold mt-1 mb-10 text-center" style={{ color: C.maroon }}>
          Good to know
        </h2>
        <div className="flex flex-col gap-3">
          {FAQS.map((f, i) => (
            <div key={f.q} className="rounded-2xl overflow-hidden" style={{ border: `1px solid ${C.line}`, backgroundColor: C.paper }}>
              <button
                onClick={() => setOpenFaq(openFaq === i ? -1 : i)}
                className="w-full flex items-center justify-between px-5 py-4 text-left font-medium text-sm"
              >
                {f.q}
                <ChevronDown size={16} style={{ transform: openFaq === i ? "rotate(180deg)" : "none", transition: "transform 0.2s" }} />
              </button>
              {openFaq === i && (
                <div className="px-5 pb-4 text-sm" style={{ color: C.inkSoft }}>
                  {f.a}
                </div>
              )}
            </div>
          ))}
        </div>
      </section>

      {/* NEWSLETTER */}
      <section className="py-14" style={{ backgroundColor: C.gold }}>
        <div className="max-w-3xl mx-auto px-5 text-center">
          <h2 className="font-display text-2xl sm:text-3xl font-semibold" style={{ color: C.maroonDark }}>
            Know before the festival stock runs out
          </h2>
          <p className="text-sm mt-2" style={{ color: C.maroonDark }}>
            One email a month, only about new batches and festival pre-orders.
          </p>
          <form
            onSubmit={(e) => {
              e.preventDefault();
              setToast("Subscribed! See you at the next festival batch.");
              window.clearTimeout(window.__pithaToastTimer);
              window.__pithaToastTimer = window.setTimeout(() => setToast(""), 1800);
              e.target.reset();
            }}
            className="mt-6 flex flex-col sm:flex-row gap-3 justify-center max-w-md mx-auto"
          >
            <input
              required
              type="email"
              placeholder="you@example.com"
              className="flex-1 px-4 py-3 rounded-full text-sm outline-none"
              style={{ backgroundColor: C.paper, color: C.ink }}
            />
            <button type="submit" className="px-6 py-3 rounded-full font-semibold text-sm" style={{ backgroundColor: C.maroonDark, color: C.cream }}>
              Subscribe
            </button>
          </form>
        </div>
      </section>

      {/* FOOTER */}
      <footer id="contact" style={{ backgroundColor: C.ink, color: "#D9CFC3" }} className="pt-14 pb-8">
        <div className="max-w-6xl mx-auto px-5 grid sm:grid-cols-2 md:grid-cols-4 gap-10">
          <div>
            <div className="rounded-2xl overflow-hidden inline-block mb-1" style={{ backgroundColor: C.paper, padding: "10px 14px" }}>
              <img src={LOGO_FULL} alt="Pitha Pasara — Odisha ra Pitha, Amara Garba" className="h-10 w-auto object-contain" />
            </div>
            <p className="text-sm mt-3 leading-relaxed">
              ଓଡ଼ିଶାର ପିଠା, ଆମର ଗର୍ବ — handmade Odia pitha, shipped fresh across India.
            </p>
            <div className="flex gap-3 mt-5">
              <a href="#" className="w-9 h-9 rounded-full flex items-center justify-center" style={{ backgroundColor: "#42352C" }}>
                <Instagram size={16} />
              </a>
              <a href="#" className="w-9 h-9 rounded-full flex items-center justify-center" style={{ backgroundColor: "#42352C" }}>
                <Facebook size={16} />
              </a>
            </div>
          </div>
          <div>
            <div className="text-sm font-semibold mb-3" style={{ color: C.cream }}>Shop · ଦୋକାନ</div>
            <ul className="text-sm space-y-2">
              <li><a href="#shop">All Pitha</a></li>
              <li><a href="#festivals">Festival Specials</a></li>
              <li><a href="#shop">Sweet Pitha</a></li>
              <li><a href="#shop">Savory Pitha</a></li>
            </ul>
          </div>
          <div>
            <div className="text-sm font-semibold mb-3" style={{ color: C.cream }}>Company · କମ୍ପାନୀ</div>
            <ul className="text-sm space-y-2">
              <li><a href="#story">Our Story</a></li>
              <li><a href="#faq">FAQ</a></li>
              <li><a href="#">Shipping Policy</a></li>
              <li><a href="#">Bulk / Corporate Orders</a></li>
            </ul>
          </div>
          <div>
            <div className="text-sm font-semibold mb-3" style={{ color: C.cream }}>Reach Us · ଯୋଗାଯୋଗ</div>
            <ul className="text-sm space-y-2.5">
              <li className="flex items-center gap-2"><MapPin size={14} /> Cuttack, Odisha, India</li>
              <li className="flex items-center gap-2"><Phone size={14} /> +91 98765 43210</li>
              <li className="flex items-center gap-2"><Mail size={14} /> hello@pithapasara.in</li>
            </ul>
          </div>
        </div>
        <div className="max-w-6xl mx-auto px-5 mt-10 pt-6 flex flex-col sm:flex-row justify-between gap-2 text-xs" style={{ borderTop: "1px solid #42352C", color: "#9C8F82" }}>
          <span>© 2026 Pitha Pasara. All rights reserved.</span>
          <span>100% vegetarian kitchen · Made fresh, packed with care</span>
        </div>
      </footer>

      {/* CART DRAWER */}
      {cartOpen && (
        <div className="fixed inset-0 z-50 flex justify-end">
          <div className="absolute inset-0 bg-black/40" onClick={() => setCartOpen(false)} />
          <div className="relative w-full max-w-sm h-full flex flex-col" style={{ backgroundColor: C.paper }}>
            <div className="flex items-center justify-between px-5 py-4" style={{ borderBottom: `1px solid ${C.line}` }}>
              <h3 className="font-display text-xl font-semibold" style={{ color: C.maroon }}>Your Pasara</h3>
              <button onClick={() => setCartOpen(false)}>
                <X size={20} />
              </button>
            </div>
            <div className="flex-1 overflow-y-auto px-5 py-4">
              {cartItems.length === 0 ? (
                <div className="text-sm text-center mt-16" style={{ color: C.inkSoft }}>
                  Your basket is empty. Add a pitha or two!
                </div>
              ) : (
                <div className="flex flex-col gap-5">
                  {cartItems.map((item) => (
                    <div key={item.id} className="flex items-center gap-3">
                      <div className="relative w-12 h-12 rounded-full flex items-center justify-center overflow-hidden shrink-0" style={{ border: `1px solid ${C.line}`, backgroundColor: C.cream }}>
                        <PithaIcon variant={item.icon} size={32} />
                        <img src={item.photo} alt={item.name} className="absolute inset-0 w-full h-full object-cover" onError={(e) => { e.currentTarget.style.display = "none"; }} />
                      </div>
                      <div className="flex-1">
                        <div className="text-sm font-semibold">{item.name}</div>
                        <div className="text-xs" style={{ color: C.inkSoft }}>₹{item.price} · {item.unit}</div>
                        <div className="flex items-center gap-2 mt-1.5">
                          <button onClick={() => changeQty(item.id, -1)} className="w-6 h-6 rounded-full flex items-center justify-center" style={{ border: `1px solid ${C.line}` }}>
                            <Minus size={11} />
                          </button>
                          <span className="font-mono text-xs w-3 text-center">{item.qty}</span>
                          <button onClick={() => changeQty(item.id, 1)} className="w-6 h-6 rounded-full flex items-center justify-center" style={{ backgroundColor: C.maroon, color: C.cream }}>
                            <Plus size={11} />
                          </button>
                        </div>
                      </div>
                      <div className="font-mono text-sm font-semibold">₹{item.qty * item.price}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
            {cartItems.length > 0 && (
              <div className="px-5 py-4" style={{ borderTop: `1px solid ${C.line}` }}>
                <div className="flex items-center justify-between text-sm mb-1">
                  <span style={{ color: C.inkSoft }}>Subtotal</span>
                  <span className="font-mono font-semibold">₹{subtotal}</span>
                </div>
                <div className="text-xs mb-4" style={{ color: C.inkSoft }}>
                  {subtotal >= 499 ? "You've unlocked free delivery." : `Add ₹${499 - subtotal} more for free delivery.`}
                </div>
                <button
                  onClick={() => {
                    setToast("This is a demo — checkout isn't connected yet.");
                    window.clearTimeout(window.__pithaToastTimer);
                    window.__pithaToastTimer = window.setTimeout(() => setToast(""), 2200);
                  }}
                  className="w-full py-3 rounded-full font-semibold text-sm"
                  style={{ backgroundColor: C.maroon, color: C.cream }}
                >
                  Checkout · ₹{subtotal}
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* TOAST */}
      {toast && (
        <div
          className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-full text-sm font-medium shadow-lg"
          style={{ backgroundColor: C.ink, color: C.cream }}
        >
          {toast}
        </div>
      )}
    </div>
  );
}

createRoot(document.getElementById("root")).render(<PithaPasara />);
</script>
</body>
</html>
